<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1420" viewBox="0 0 880 710" role="img" aria-labelledby="title description">
  <title id="title">Luma widget visual redesign proposal</title>
  <desc id="description">Fictional Tasks and Habits widgets. Plain Capture and Refresh utilities sit above short scope and freshness metadata. Complete and plus-one fills are inset in separate touch targets. Habits has an omitted-item cue beneath its title. A compact two-task composition and a regular habits composition illustrate proposed spacing, not measured Android rendering.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .page-title { fill: #23382D; font-size: 26px; font-weight: 700; }
      .page-copy { fill: #53665A; font-size: 14px; }
      .eyebrow { fill: #53665A; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .surface { fill: #101813; stroke: #34483B; stroke-width: 1; }
      .heading { fill: #E1EEE5; font-size: 18px; font-weight: 700; }
      .item { fill: #E1EEE5; font-size: 16px; font-weight: 700; }
      .body { fill: #E1EEE5; font-size: 14px; }
      .secondary { fill: #ADBCB1; font-size: 12px; }
      .support { fill: #ADBCB1; font-size: 14px; }
      .utility { fill: #BCEEDB; font-size: 14px; }
      .action-fill { fill: #174E40; }
      .action-label { fill: #D1F5E3; font-size: 14px; text-anchor: middle; }
      .overdue { fill: #F0C38B; font-size: 14px; }
      .note-title { fill: #23382D; font-size: 15px; font-weight: 700; }
      .note { fill: #53665A; font-size: 13px; }
      .rule { stroke: #CFD8CF; stroke-width: 1; }
    </style>
    <g id="refresh" fill="none" stroke="#BCEEDB" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 -5.5 A8 8 0 1 0 7.5 3"/>
      <path d="M6.5 -11 L6.5 -5.5 L1 -5.5"/>
    </g>
  </defs>
  <rect width="880" height="710" fill="#F1F4ED"/>
  <text x="40" y="45" class="page-title">Luma, with room to read and act</text>
  <text x="40" y="72" class="page-copy">Proposed dark appearance · fictional content · nominal card width 373dp</text>
  <text x="40" y="105" class="eyebrow">TASKS · COMPACT TWO-ITEM COMPOSITION</text>
  <text x="467" y="105" class="eyebrow">HABITS · REGULAR COMPOSITION</text>

  <!-- All target allocations are at least 48 units high. Visual action fills are inset. -->
  <g transform="translate(40 120)">
    <rect width="373" height="262" rx="28" class="surface"/>
    <text x="12" y="42" class="heading">Tasks ›</text>
    <text x="269.5" y="41" text-anchor="middle" class="utility">Capture</text>
    <use href="#refresh" x="337" y="36"/>
    <text x="12" y="82" class="body">2 due today or overdue</text>
    <text x="12" y="102" class="secondary">Oct 20, 2026 · Updated 5:41 PM</text>

    <g transform="translate(12 118)">
      <text x="0" y="22" class="item">Send invoice</text>
      <text x="0" y="43" class="overdue">Overdue · Oct 19, 2026</text>
      <rect x="265" y="10" width="84" height="36" rx="12" class="action-fill"/>
      <text x="307" y="33" class="action-label">Complete</text>
    </g>
    <g transform="translate(12 182)">
      <text x="0" y="22" class="item">Plan weekend</text>
      <text x="0" y="43" class="support">Due today</text>
      <rect x="265" y="10" width="84" height="36" rx="12" class="action-fill"/>
      <text x="307" y="33" class="action-label">Complete</text>
    </g>
  </g>

  <g transform="translate(467 120)">
    <rect width="373" height="321" rx="28" class="surface"/>
    <text x="12" y="33" class="heading">Habits ›</text>
    <text x="12" y="50" class="secondary">1 more</text>
    <text x="269.5" y="41" text-anchor="middle" class="utility">Capture</text>
    <use href="#refresh" x="337" y="36"/>
    <text x="12" y="82" class="body">0 of 4 targets reached</text>
    <text x="12" y="102" class="secondary">Oct 20, 2026 · Updated 5:41 PM</text>

    <g transform="translate(12 118)">
      <text x="0" y="30" class="item">Drink water</text>
      <text x="293" y="30" text-anchor="end" class="support">3 / 8</text>
      <rect x="301" y="6" width="48" height="36" rx="12" class="action-fill"/>
      <text x="325" y="29" class="action-label">+1</text>
    </g>
    <g transform="translate(12 174)">
      <text x="0" y="30" class="item">Stretch</text>
      <text x="293" y="30" text-anchor="end" class="support">1 / 5</text>
      <rect x="301" y="6" width="48" height="36" rx="12" class="action-fill"/>
      <text x="325" y="29" class="action-label">+1</text>
    </g>
    <g transform="translate(12 230)">
      <text x="0" y="30" class="item">Read a chapter</text>
      <text x="293" y="30" text-anchor="end" class="support">0 / 1</text>
      <rect x="301" y="6" width="48" height="36" rx="12" class="action-fill"/>
      <text x="325" y="29" class="action-label">+1</text>
    </g>
  </g>

  <text x="40" y="412" class="note-title">Keep small datasets compact</text>
  <text x="40" y="434" class="note">Normal row heights; resize guidance belongs in setup.</text>
  <text x="40" y="454" class="note">Launcher cells remain under the user's control.</text>

  <line x1="40" x2="840" y1="485" y2="485" class="rule"/>
  <text x="40" y="518" class="note-title">01  Quiet utilities</text>
  <text x="40" y="541" class="note">Title opens the full list.</text>
  <text x="40" y="561" class="note">Capture stays labeled and separate.</text>
  <text x="326" y="518" class="note-title">02  Clear row boundaries</text>
  <text x="326" y="541" class="note">8dp between rows and action columns.</text>
  <text x="326" y="561" class="note">Small fills inside full touch targets.</text>
  <text x="612" y="518" class="note-title">03  Metadata stays together</text>
  <text x="612" y="541" class="note">Short scope, explicit date, freshness.</text>
  <text x="612" y="561" class="note">Item state remains next to its title.</text>

  <line x1="40" x2="840" y1="592" y2="592" class="rule"/>
  <text x="40" y="622" class="page-copy">Recovery, large text and privacy take priority over row density.</text>
  <text x="40" y="644" class="note">Undo / Retry reserve space before rows; narrow layouts stack controls; names remain hidden by default.</text>
  <text x="40" y="680" class="eyebrow">DESIGN SCHEMATIC · NOT A LAUNCHER SCREENSHOT OR VERIFIED ROW-CAPACITY RESULT</text>
</svg>
