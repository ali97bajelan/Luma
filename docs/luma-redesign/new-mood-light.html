<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mood Check-in</title>
<!-- Google Fonts: Newsreader (Editorial Serif) & Plus Jakarta Sans (Clean Modern Sans) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#fff8f4',
              dim: '#e0d9d4',
              bright: '#fff8f4',
              lowest: '#ffffff',
              low: '#faf2ed',
              container: '#f4ece6',
              high: '#eee6e0',
            },
            ink: {
              DEFAULT: '#241c18',
              muted: '#7a6f69',
              light: '#9d918a',
            },
            terracotta: {
              DEFAULT: '#ba4d28',
              hover: '#a44221',
              tint: '#fcf0ec',
              subtle: '#fae3da',
            },
            sage: {
              DEFAULT: '#526350',
              tint: '#edf3ec',
              border: '#d2ded0',
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          borderRadius: {
            'pill': '9999px',
            'card': '1.25rem',
          },
          boxShadow: {
            'subtle': '0 2px 8px -2px rgba(36, 28, 24, 0.05)',
            'pill-active': '0 4px 14px rgba(186, 77, 40, 0.22)',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f0ebe6;
    }
    .font-serif-title {
      font-family: 'Newsreader', serif;
    }
    /* Hide scrollbars smoothly */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
<style data-purpose="interactive-states">
    .chip-toggle:active {
      transform: scale(0.97);
    }
    .score-btn:active {
      transform: scale(0.95);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 text-ink antialiased selection:bg-terracotta-subtle selection:text-terracotta">
<!-- BEGIN: Mobile Device Canvas Frame -->
<main class="w-full max-w-[430px] min-h-screen sm:min-h-[920px] sm:max-h-[940px] bg-surface flex flex-col justify-between relative sm:rounded-[3rem] shadow-2xl overflow-hidden border border-[#e8ded7]">
<!-- Top Area: Status Bar + Header + Scrollable Content -->
<div class="flex-1 flex flex-col overflow-y-auto">
<!-- BEGIN: Mobile Status Bar -->
<section class="w-full pt-3 pb-1 px-7 flex items-center justify-between text-xs font-semibold text-ink select-none" data-purpose="status-bar">
<span class="tracking-tight">17:21</span>
<div class="flex items-center space-x-1.5 text-ink">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.3"></path>
<path d="M12 7c-2.76 0-5 2.24-5 5 0 1.25.46 2.4 1.22 3.3L12 18l3.78-2.7C16.54 14.4 17 13.25 17 12c0-2.76-2.24-5-5-5z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3c3.78 0 7.22 1.48 9.78 3.91L12 18.66 2.22 10.91C4.78 8.48 8.22 7 12 7z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<span class="text-[10px] mr-1 font-bold">66%</span>
<div class="w-5 h-2.5 border border-ink/80 rounded-sm p-[1px] flex items-center">
<div class="bg-ink h-full w-2/3 rounded-2xs"></div>
</div>
</div>
</div>
</section>
<!-- END: Mobile Status Bar -->
<!-- BEGIN: Header -->
<header class="px-6 pt-3 pb-4 flex items-center justify-between" data-purpose="sheet-header">
<div class="flex items-center gap-4">
<button aria-label="Close" class="w-9 h-9 rounded-full flex items-center justify-center text-ink hover:bg-surface-high transition-colors -ml-1" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="font-serif-title text-[28px] leading-tight font-medium tracking-tight text-ink">
            Mood check-in
          </h1>
</div>
</header>
<!-- END: Header -->
<!-- Main Form Content -->
<div class="px-6 space-y-6 pb-6">
<!-- BEGIN: Timestamp Selector Pill -->
<section class="w-full" data-purpose="timestamp-selector">
<div class="w-full bg-surface-low border border-[#ebdfd7] rounded-pill px-5 py-3 flex items-center justify-between shadow-subtle">
<div class="flex items-center space-x-2">
<svg class="w-4 h-4 text-terracotta/80" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke-width="1.8"></circle>
<path d="M12 7v5l3 2" stroke-linecap="round" stroke-width="1.8"></path>
</svg>
<span class="text-sm font-semibold tracking-wide text-ink">Today <span class="text-ink-light mx-0.5">·</span> 17:21</span>
</div>
<button class="text-terracotta text-sm font-semibold hover:text-terracotta-hover transition-colors px-2 py-0.5 rounded-lg active:bg-terracotta-tint" type="button">
              Change
            </button>
</div>
</section>
<!-- END: Timestamp Selector Pill -->
<!-- BEGIN: Score Rating Section -->
<section class="space-y-3" data-purpose="rating-scale">
<h2 class="text-base font-semibold text-ink tracking-tight">How do you feel?</h2>
<div class="flex justify-between items-center text-xs font-medium text-ink-muted px-1">
<span>Very low</span>
<span>Great</span>
</div>
<!-- Rating Buttons 1 to 5 (State: 4 is actively selected) -->
<div class="grid grid-cols-5 gap-2.5 pt-1">
<button class="score-btn h-12 rounded-2xl border border-[#e4d8d0] bg-surface-lowest text-ink font-semibold text-base transition-all hover:border-terracotta/40 flex items-center justify-center" type="button">
              1
            </button>
<button class="score-btn h-12 rounded-2xl border border-[#e4d8d0] bg-surface-lowest text-ink font-semibold text-base transition-all hover:border-terracotta/40 flex items-center justify-center" type="button">
              2
            </button>
<button class="score-btn h-12 rounded-2xl border border-[#e4d8d0] bg-surface-lowest text-ink font-semibold text-base transition-all hover:border-terracotta/40 flex items-center justify-center" type="button">
              3
            </button>
<!-- Selected State (Score 4) -->
<button class="score-btn h-12 rounded-2xl bg-terracotta text-white font-bold text-base shadow-pill-active ring-2 ring-terracotta ring-offset-2 ring-offset-surface flex items-center justify-center scale-[1.02]" type="button">
              4
            </button>
<button class="score-btn h-12 rounded-2xl border border-[#e4d8d0] bg-surface-lowest text-ink font-semibold text-base transition-all hover:border-terracotta/40 flex items-center justify-center" type="button">
              5
            </button>
</div>
</section>
<!-- END: Score Rating Section -->
<!-- BEGIN: Emotions Tag Cloud -->
<section class="space-y-2.5" data-purpose="emotions-selector">
<div>
<h2 class="text-base font-semibold text-ink tracking-tight">Emotions</h2>
<p class="text-xs text-ink-muted mt-0.5">Optional. Choose as many as you like.</p>
</div>
<!-- Pill tags flex wrap matching screenshot tags -->
<div class="flex flex-wrap gap-2 pt-1">
<!-- Angry -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Angry
            </button>
<!-- Anxious -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Anxious
            </button>
<!-- Calm (Selected state: Soft Sage green styling) -->
<button class="chip-toggle px-4 py-2 rounded-full bg-sage-tint border-1.5 border-sage text-sage text-sm font-semibold shadow-xs flex items-center space-x-1.5" type="button">
<span>Calm</span>
<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Excited -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Excited
            </button>
<!-- Grateful (Selected state: Terracotta highlight) -->
<button class="chip-toggle px-4 py-2 rounded-full bg-terracotta-tint border-1.5 border-terracotta text-terracotta text-sm font-semibold shadow-xs flex items-center space-x-1.5" type="button">
<span>Grateful</span>
<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Happy -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Happy
            </button>
<!-- Hopeful -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Hopeful
            </button>
<!-- Lonely -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Lonely
            </button>
<!-- Overwhelmed -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Overwhelmed
            </button>
<!-- Proud -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Proud
            </button>
<!-- Sad -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Sad
            </button>
<!-- Tired -->
<button class="chip-toggle px-4 py-2 rounded-full border border-[#dec5b9] bg-surface-lowest/70 text-ink text-sm font-medium transition hover:border-terracotta/60" type="button">
              Tired
            </button>
</div>
</section>
<!-- END: Emotions Tag Cloud -->
<!-- BEGIN: Note and Context Section -->
<section class="space-y-2 pt-1" data-purpose="note-and-context">
<label class="block text-sm font-semibold text-terracotta tracking-tight" for="mood-notes">
            Note and context
          </label>
<div class="relative rounded-2xl bg-surface-lowest border border-[#ebdfd7] shadow-subtle p-3.5 focus-within:ring-2 focus-within:ring-terracotta/50 focus-within:border-terracotta transition-all">
<textarea class="w-full bg-transparent border-0 p-0 text-sm leading-relaxed text-ink placeholder:text-ink-light/80 focus:ring-0 resize-none font-sans" id="mood-notes" placeholder="Add a note, energy, stress, people or a place." rows="3"></textarea>
<div class="mt-2 flex items-center justify-between pt-2 border-t border-[#f5ede8] text-ink-light">
<span class="text-[11px] font-medium tracking-wide">Reflective Journal entry</span>
<svg class="w-4 h-4 text-ink-light/70" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
</div>
</section>
<!-- END: Note and Context Section -->
</div>
</div>
<!-- BEGIN: Bottom Actions & Android Home Navigation Indicator -->
<footer class="px-6 pb-3 pt-3 bg-gradient-to-t from-surface via-surface to-surface/80 border-t border-[#f3e9e3]" data-purpose="footer-actions">
<!-- Save Button CTA -->
<button class="w-full h-14 bg-terracotta hover:bg-terracotta-hover active:scale-[0.99] text-white font-semibold text-base rounded-pill shadow-lg shadow-terracotta/25 flex items-center justify-center transition-all" type="button">
        Save
      </button>
<!-- Android Navigation Bar Indicator (from visual reference) -->
<div class="w-full pt-4 pb-1.5 flex items-center justify-around px-8 opacity-70">
<!-- Back Triangle -->
<svg class="w-4 h-4 text-ink/75" fill="currentColor" viewbox="0 0 24 24">
<path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"></path>
</svg>
<!-- Home Ring -->
<div class="w-3.5 h-3.5 rounded-full border-2 border-ink/75"></div>
<!-- Recents Square -->
<div class="w-3 h-3 border-2 border-ink/75 rounded-xs"></div>
</div>
</footer>
<!-- END: Bottom Actions & Navigation -->
</main>
<!-- END: Mobile Device Canvas Frame -->
</body></html>
