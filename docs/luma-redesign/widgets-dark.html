<script data-purpose="interactive-enhancements">
    document.addEventListener('DOMContentLoaded', () => {
      const themeToggleBtn = document.getElementById('themeToggle');
      const themeLabel = document.getElementById('themeLabel');
      const tasksWidget = document.getElementById('tasksWidget');
      const habitsWidget = document.getElementById('habitsWidget');

      let isDarkMode = false;

      // Toggle Theme presentation for widgets: Material Light Cream vs Obsidian Deep
      themeToggleBtn.addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        
        if (isDarkMode) {
          themeLabel.textContent = 'Dark';
          
          // Switch to M3 Dark Surface Palette
          [tasksWidget, habitsWidget].forEach(widget => {
            widget.classList.remove('bg-[#F4F4EB]', 'text-neutral-900', 'border-white/40');
            widget.classList.add('bg-[#1E2320]/90', 'text-neutral-100', 'border-white/10');
            
            // Subcontainers styling
            widget.querySelectorAll('.task-row, .habit-row').forEach(row => {
              row.classList.remove('bg-white/70', 'border-neutral-200/50');
              row.classList.add('bg-black/30', 'border-white/5');
            });

            // Headers
            widget.querySelectorAll('h2, h3').forEach(t => {
              t.classList.remove('text-neutral-900');
              t.classList.add('text-neutral-100');
            });
            
            // Buttons dark adaptation
            widget.querySelectorAll('.complete-btn, .habit-plus-btn').forEach(btn => {
              btn.classList.remove('bg-[#CCE8DB]', 'text-[#0D3823]');
              btn.classList.add('bg-[#294536]', 'text-[#D8EADB]');
            });
          });

        } else {
          themeLabel.textContent = 'Light';

          // Switch back to Warm Light Expressive
          [tasksWidget, habitsWidget].forEach(widget => {
            widget.classList.add('bg-[#F4F4EB]', 'text-neutral-900', 'border-white/40');
            widget.classList.remove('bg-[#1E2320]/90', 'text-neutral-100', 'border-white/10');
            
            widget.querySelectorAll('.task-row, .habit-row').forEach(row => {
              row.classList.add('bg-white/70', 'border-neutral-200/50');
              row.classList.remove('bg-black/30', 'border-white/5');
            });

            widget.querySelectorAll('h2, h3').forEach(t => {
              t.classList.add('text-neutral-900');
              t.classList.remove('text-neutral-100');
            });

            widget.querySelectorAll('.complete-btn, .habit-plus-btn').forEach(btn => {
              btn.classList.add('bg-[#CCE8DB]', 'text-[#0D3823]');
              btn.classList.remove('bg-[#294536]', 'text-[#D8EADB]');
            });
          });
        }
      });

      // Interactive feedback for habit +1 increments
      document.querySelectorAll('.habit-plus-btn').forEach(button => {
        button.addEventListener('click', function() {
          const row = this.closest('.habit-row');
          const scoreEl = row.querySelector('.habit-score');
          const progressBar = row.querySelector('.bg-gradient-to-r, .bg-neutral-300');
          
          if (scoreEl && scoreEl.textContent.includes('/')) {
            const parts = scoreEl.textContent.split('/').map(s => parseInt(s.trim()));
            let current = parts[0];
            const max = parts[1];
            
            if (current < max) {
              current += 1;
              scoreEl.textContent = `${current} / ${max}`;
              const pct = Math.round((current / max) * 100);
              progressBar.style.width = `${pct}%`;
              
              // Haptic bounce animation
              this.classList.add('ring-2', 'ring-emerald-400');
              setTimeout(() => this.classList.remove('ring-2', 'ring-emerald-400'), 300);
            }
          }
        });
      });

      // Complete button interactive check-off
      document.querySelectorAll('.complete-btn').forEach(button => {
        button.addEventListener('click', function() {
          const row = this.closest('.task-row');
          row.style.opacity = '0.5';
          this.textContent = 'Done ✓';
          this.disabled = true;
          this.classList.add('pointer-events-none');
        });
      });
    });
  </script>
<!-- END: Interactive Theme Toggle and Tactile Interactions -->
</body></html>
