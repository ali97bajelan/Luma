<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>New Habit - Luma Journal</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Newsreader (Editorial Serif) & Plus Jakarta Sans / Inter for UI -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#fff8f4',
              dim: '#e0d9d4',
              bright: '#fff8f4',
              low: '#faf2ed',
              container: '#f5ebe4',
              high: '#eee3db',
            },
            espresso: {
              DEFAULT: '#241c18',
              muted: '#736862',
              light: '#a69b93',
            },
            terracotta: {
              DEFAULT: '#ba4d28',
              hover: '#a24120',
              container: '#fcebe5',
              border: '#f0c7b7',
            },
            sage: {
              DEFAULT: '#46634c',
              hover: '#38503d',
              container: '#e7ede8',
              border: '#cbd8cd',
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          borderRadius: {
            '4xl': '2rem',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Form & Micro-interaction Styles -->
<style data-purpose="base-typography">
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f2ece6;
    }
    .font-editorial {
      font-family: 'Newsreader', Georgia, serif;
      letter-spacing: -0.015em;
    }
  </style>
<style data-purpose="input-custom-styles">
    /* Subtle float effect and clean border states */
    .journal-input {
      background-color: #faf2ed;
      border: 1.5px solid #e7ded7;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .journal-input:focus-within {
      background-color: #ffffff;
      border-color: #ba4d28;
      box-shadow: 0 0 0 4px rgba(186, 77, 40, 0.1);
    }
    .touch-target {
      min-height: 48px;
    }
  </style>
<!-- END: Custom Form & Micro-interaction Styles -->
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 text-espresso">
<!-- BEGIN: Mobile Device Canvas Container -->
<div class="w-full max-w-md h-[100dvh] sm:h-[880px] bg-surface flex flex-col justify-between overflow-hidden sm:rounded-4xl sm:shadow-2xl border border-espresso/10 relative">
<!-- BEGIN: Android Light Status Bar -->
<header class="w-full px-6 pt-3 pb-1 flex justify-between items-center text-xs font-semibold tracking-wider text-espresso/80 z-20 select-none" data-purpose="status-bar">
<span>17:20</span>
<div class="flex items-center space-x-2">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.784 1.399 8.163-7.333-3.856-7.333 3.856 1.399-8.163-5.934-5.784 8.2-1.192zm0 5.702l-2.223 4.504-4.97.722 3.597 3.506-.849 4.948 4.445-2.337 4.445 2.337-.849-4.948 3.597-3.506-4.97-.722z"></path></svg>
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23 5.77 19.65l.62-.62C7.93 20.26 9.88 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"></path></svg>
<span class="text-[11px] font-bold">66%</span>
</div>
</header>
<!-- END: Android Light Status Bar -->
<!-- BEGIN: Main Sheet Header -->
<div class="px-5 pt-3 pb-2 flex items-center gap-3 border-b border-espresso/5 bg-surface" data-purpose="modal-header">
<button aria-label="Close" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container active:scale-95 transition-all text-espresso/90">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="font-editorial text-3xl font-medium tracking-tight text-espresso">New habit</h1>
</div>
<!-- END: Main Sheet Header -->
<!-- BEGIN: Form Scroll Area -->
<main class="flex-1 overflow-y-auto px-5 py-4 space-y-5" data-purpose="form-content">
<!-- BEGIN: Timezone Indicator -->
<div class="flex items-center gap-2 text-xs font-medium text-espresso-muted px-1" data-purpose="timezone-badge">
<svg class="w-4 h-4 text-espresso-muted/80" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke-width="1.8"></circle>
<path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span>Tracking zone: <span class="text-espresso font-semibold">Asia/Tehran</span></span>
</div>
<!-- END: Timezone Indicator -->
<!-- BEGIN: Habit Name Field -->
<div class="journal-input rounded-2xl p-3 focus-within:ring-0" data-purpose="name-input-group">
<label class="block text-xs font-semibold text-espresso-muted tracking-wide uppercase mb-1" for="habit-name">Name</label>
<input class="w-full bg-transparent border-0 p-0 text-base font-medium text-espresso placeholder-espresso-light/70 focus:ring-0 focus:outline-none" id="habit-name" placeholder="e.g. Mindful Reflection or Hydration" type="text"/>
</div>
<!-- END: Habit Name Field -->
<!-- BEGIN: Counter Units Field -->
<div>
<div class="journal-input rounded-2xl p-3 focus-within:ring-0" data-purpose="counting-metric-group">
<label class="block text-xs font-semibold text-espresso-muted tracking-wide uppercase mb-1" for="counting-metric">What are you counting?</label>
<input class="w-full bg-transparent border-0 p-0 text-base font-medium text-espresso placeholder-espresso-light/70 focus:ring-0 focus:outline-none" id="counting-metric" placeholder="e.g. glasses, minutes, pages" type="text"/>
</div>
<p class="text-xs text-espresso-muted/90 mt-1.5 ml-2 font-medium">Each tap adds one.</p>
</div>
<!-- END: Counter Units Field -->
<!-- BEGIN: Daily Target Numeric Field -->
<div class="relative journal-input rounded-2xl px-4 py-2.5 focus-within:ring-0" data-purpose="daily-target-group">
<label class="block text-xs font-semibold text-espresso-muted tracking-wide uppercase" for="daily-target">Daily target</label>
<div class="flex items-center justify-between mt-0.5">
<input class="bg-transparent border-0 p-0 text-2xl font-serif font-semibold text-espresso w-24 focus:ring-0 focus:outline-none" id="daily-target" min="1" type="number" value="1"/>
<span class="text-xs font-medium text-espresso-muted bg-surface-container px-2.5 py-1 rounded-full">Times / day</span>
</div>
</div>
<!-- END: Daily Target Numeric Field -->
<!-- BEGIN: Start Date Pill Button -->
<button class="w-full py-3.5 px-5 rounded-full border-1.5 border-terracotta/40 bg-surface-low hover:bg-terracotta-container/30 active:scale-[0.99] transition-all flex items-center justify-center gap-2 group" data-purpose="start-date-selector" type="button">
<svg class="w-4 h-4 text-terracotta group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="18" rx="4" stroke-width="2" width="18" x="3" y="4"></rect>
<path d="M16 2v4M8 2v4M3 10h18" stroke-width="2"></path>
</svg>
<span class="text-sm font-semibold text-espresso">Start date: <span class="text-terracotta">Oct 23, 2026</span></span>
</button>
<!-- END: Start Date Pill Button -->
<!-- BEGIN: Schedule Frequency Section -->
<div class="space-y-3 pt-2" data-purpose="schedule-options">
<h2 class="font-editorial text-xl font-medium text-espresso tracking-tight">Scheduled weekdays</h2>
<div class="text-xs font-semibold text-espresso-muted uppercase tracking-wider">Schedule</div>
<!-- Frequency Options List -->
<div class="flex flex-wrap gap-2">
<!-- Daily Pill (Selected / Active) -->
<button class="px-5 py-2.5 rounded-full bg-sage text-white text-sm font-medium shadow-sm hover:bg-sage-hover active:scale-95 transition-all flex items-center gap-1.5" type="button">
<svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
            Daily
          </button>
<!-- Weekdays Pill (Outlined) -->
<button class="px-4 py-2.5 rounded-full border border-espresso/20 bg-surface text-espresso/90 text-sm font-medium hover:bg-surface-container active:scale-95 transition-all" type="button">
            Weekdays (Monday–Friday)
          </button>
<!-- Custom Pill (Outlined) -->
<button class="px-4 py-2.5 rounded-full border border-espresso/20 bg-surface text-espresso/90 text-sm font-medium hover:bg-surface-container active:scale-95 transition-all" type="button">
            Custom
          </button>
</div>
<!-- Individual Weekday Chips Selector -->
<div class="pt-2" data-purpose="weekday-chip-group">
<!-- Mon - Fri Row -->
<div class="grid grid-cols-5 gap-2 mb-2">
<!-- Mon (Selected) -->
<button class="h-12 flex items-center justify-center rounded-2xl bg-sage text-white text-sm font-semibold shadow-xs hover:bg-sage-hover active:scale-95 transition-all" type="button">
              Mon
            </button>
<!-- Tue (Selected) -->
<button class="h-12 flex items-center justify-center rounded-2xl bg-sage text-white text-sm font-semibold shadow-xs hover:bg-sage-hover active:scale-95 transition-all" type="button">
              Tue
            </button>
<!-- Wed (Selected) -->
<button class="h-12 flex items-center justify-center rounded-2xl bg-sage text-white text-sm font-semibold shadow-xs hover:bg-sage-hover active:scale-95 transition-all" type="button">
              Wed
            </button>
<!-- Thu (Selected) -->
<button class="h-12 flex items-center justify-center rounded-2xl bg-sage text-white text-sm font-semibold shadow-xs hover:bg-sage-hover active:scale-95 transition-all" type="button">
              Thu
            </button>
<!-- Fri (Selected) -->
<button class="h-12 flex items-center justify-center rounded-2xl bg-sage text-white text-sm font-semibold shadow-xs hover:bg-sage-hover active:scale-95 transition-all" type="button">
              Fri
            </button>
</div>
<!-- Sat - Sun Row -->
<div class="grid grid-cols-5 gap-2">
<!-- Sat (Selected) -->
<button class="h-12 flex items-center justify-center rounded-2xl bg-sage text-white text-sm font-semibold shadow-xs hover:bg-sage-hover active:scale-95 transition-all" type="button">
              Sat
            </button>
<!-- Sun (Selected) -->
<button class="h-12 flex items-center justify-center rounded-2xl bg-sage text-white text-sm font-semibold shadow-xs hover:bg-sage-hover active:scale-95 transition-all" type="button">
              Sun
            </button>
<!-- Empty slots for grid visual alignment -->
<div class="col-span-3"></div>
</div>
</div>
</div>
<!-- END: Schedule Frequency Section -->
</main>
<!-- END: Form Scroll Area -->
<!-- BEGIN: Fixed Bottom Action Bar -->
<footer class="p-5 pt-3 bg-gradient-to-t from-surface via-surface to-surface/90 border-t border-espresso/5 select-none" data-purpose="action-bar">
<!-- Terracotta Save Button -->
<button class="w-full h-14 bg-terracotta hover:bg-terracotta-hover text-white text-base font-semibold rounded-full shadow-lg shadow-terracotta/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer" id="save-habit-button" type="button">
<span>Save</span>
</button>
<!-- Android Modern Gesture Bar Handle -->
<div class="w-32 h-1 bg-espresso/25 rounded-full mx-auto mt-4 mb-0.5"></div>
</footer>
<!-- END: Fixed Bottom Action Bar -->
</div>
<!-- END: Mobile Device Canvas Container -->
<!-- BEGIN: Interactive Day Toggle Demo Logic -->
<script data-purpose="weekday-toggle">
    // Add micro-interaction to toggle days on/off
    document.querySelectorAll('[data-purpose="weekday-chip-group"] button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const isActive = btn.classList.contains('bg-sage');
        if (isActive) {
          btn.classList.remove('bg-sage', 'text-white');
          btn.classList.add('bg-surface-low', 'text-espresso-muted', 'border', 'border-espresso/15');
        } else {
          btn.classList.add('bg-sage', 'text-white');
          btn.classList.remove('bg-surface-low', 'text-espresso-muted', 'border', 'border-espresso/15');
        }
      });
    });
  </script>
<!-- END: Interactive Day Toggle Demo Logic -->
</body></html>
