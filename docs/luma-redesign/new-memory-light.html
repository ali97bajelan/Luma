<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Record a Memory - Luma Expressive Journal</title>
<!-- Google Fonts: Newsreader (Editorial Serif) & Plus Jakarta Sans (UI Sans) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              terracotta: '#ba4d28',
              'terracotta-hover': '#a13f1e',
              'terracotta-light': '#faece6',
              sage: '#526350',
              'sage-light': '#eff4ed',
            },
            journal: {
              surface: '#fff8f4',
              'surface-dim': '#ede3dc',
              'surface-low': '#faf2ed',
              'surface-lowest': '#ffffff',
              ink: '#241c18',
              'ink-muted': '#7e716a',
              'border-subtle': '#eddcd1',
              'border-focus': '#ba4d28'
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          borderRadius: {
            '2xl': '1.25rem',
            '3xl': '1.75rem',
            '4xl': '2.25rem',
          }
        }
      }
    }
  </script>
<!-- Custom Typography and Reset Styles -->
<style data-purpose="custom-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f3ece6;
      color: #241c18;
      -webkit-tap-highlight-color: transparent;
    }
    .font-editorial {
      font-family: 'Newsreader', serif;
    }
    textarea::placeholder, input::placeholder {
      color: #a4968e;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-md bg-journal-surface min-h-screen sm:min-h-[880px] sm:max-h-[920px] sm:rounded-[2.8rem] shadow-2xl flex flex-col justify-between overflow-hidden border border-journal-border-subtle relative" data-purpose="mobile-viewport-container">
<!-- BEGIN: AndroidStatusBar -->
<div class="w-full pt-3 px-6 pb-1 flex justify-between items-center text-xs font-semibold text-journal-ink select-none shrink-0" data-purpose="android-status-bar">
<!-- Current Time -->
<span class="tracking-tight text-journal-ink">17:21</span>
<!-- System Icons: Network, Wifi, Battery -->
<div class="flex items-center space-x-2 text-journal-ink">
<span class="text-[10px] font-mono font-medium tracking-tight text-journal-ink/75">11.3 KB/s</span>
<!-- Bluetooth Icon -->
<svg class="w-3.5 h-3.5 fill-current opacity-85" viewbox="0 0 24 24">
<path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"></path>
</svg>
<!-- Cell Signal -->
<svg class="w-3.5 h-3.5 fill-current opacity-85" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C2.89 16.51 2 14.36 2 12c0-5.52 4.48-10 10-10s10 4.48 10 10c0 2.36-.89 4.51-2.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm-6 9c0-3.31 2.69-6 6-6s6 2.69 6 6c0 1.47-.53 2.82-1.42 3.87l-.73-.73A4.95 4.95 0 0 0 17 12c0-2.76-2.24-5-5-5s-5 2.24-5 5c0 1.25.46 2.39 1.22 3.27l-.73.73C6.56 14.93 6 13.53 6 12zm3 0c0-1.66 1.34-3 3-3s3 1.34 3 3c0 .76-.28 1.46-.76 2l-.74-.74A1.99 1.99 0 0 0 13 12c0-.55-.45-1-1-1s-1 .45-1 1c0 .32.15.6.38.78l-.75.75C10.22 13.06 9 12 9 12z"></path>
</svg>
<!-- Battery Pill -->
<div class="flex items-center space-x-0.5">
<span class="text-[11px] font-bold">66</span>
<div class="w-4 h-2.5 border border-journal-ink rounded-sm p-[1px] flex items-center">
<div class="bg-journal-ink h-full w-[66%] rounded-[0.5px]"></div>
</div>
</div>
</div>
</div>
<!-- END: AndroidStatusBar -->
<!-- BEGIN: SheetHeader -->
<header class="px-5 pt-3 pb-2 flex items-center justify-between shrink-0" data-purpose="sheet-top-navigation">
<div class="flex items-center space-x-3.5">
<button aria-label="Close" class="w-9 h-9 rounded-full flex items-center justify-center text-journal-ink hover:bg-journal-surface-dim transition-colors active:scale-95" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="font-editorial text-[1.75rem] font-medium tracking-tight text-journal-ink">Record a memory</h1>
</div>
<!-- Subtle contextual badge / draft indicator -->
<span class="text-[11px] uppercase tracking-wider font-semibold text-journal-ink-muted bg-journal-surface-low border border-journal-border-subtle px-2.5 py-1 rounded-full">
        Draft
      </span>
</header>
<!-- END: SheetHeader -->
<!-- BEGIN: FormScrollableContent -->
<main class="flex-1 overflow-y-auto px-5 py-2 space-y-4" data-purpose="memory-editor-body">
<!-- BEGIN: TimestampBar -->
<section class="bg-journal-surface-low border border-journal-border-subtle rounded-2xl px-4 py-3 flex items-center justify-between shadow-[0_1px_3px_rgba(0,0,0,0.02)]" data-purpose="timestamp-indicator">
<div class="flex items-center space-x-2 text-journal-ink font-medium">
<svg class="w-4 h-4 text-brand-terracotta" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-sm font-semibold tracking-wide">Today <span class="text-journal-ink-muted font-normal">·</span> 17:21</span>
</div>
<button class="text-sm font-semibold text-brand-terracotta hover:text-brand-terracotta-hover transition-colors px-2 py-1 rounded-lg hover:bg-brand-terracotta-light/60" type="button">
          Change
        </button>
</section>
<!-- END: TimestampBar -->
<!-- BEGIN: TitleInputSection -->
<section data-purpose="title-field-container">
<label class="sr-only" for="memory-title">Title (optional)</label>
<div class="bg-journal-surface-lowest border border-journal-border-subtle rounded-2xl px-4 py-3.5 focus-within:border-brand-terracotta focus-within:ring-2 focus-within:ring-brand-terracotta/15 transition-all shadow-sm">
<input class="w-full bg-transparent border-none p-0 text-base font-medium text-journal-ink focus:outline-none focus:ring-0 placeholder:text-journal-ink-muted/70" id="memory-title" name="memory-title" placeholder="Title (optional)" type="text"/>
</div>
</section>
<!-- END: TitleInputSection -->
<!-- BEGIN: ReflectionBodySection -->
<section data-purpose="reflection-input-container">
<label class="sr-only" for="memory-description">Describe this memory</label>
<div class="bg-journal-surface-lowest border border-journal-border-subtle rounded-2xl p-4 focus-within:border-brand-terracotta focus-within:ring-2 focus-within:ring-brand-terracotta/15 transition-all shadow-sm">
<textarea class="w-full bg-transparent border-none p-0 text-base leading-relaxed text-journal-ink font-editorial placeholder:text-journal-ink-muted/70 focus:outline-none focus:ring-0 resize-none font-normal" id="memory-description" name="memory-description" placeholder="Describe this memory..." rows="5"></textarea>
<!-- Word/Prompt hint toolbar -->
<div class="mt-2 pt-2 border-t border-journal-border-subtle/50 flex items-center justify-between text-xs text-journal-ink-muted">
<span class="italic">What made this moment memorable?</span>
<span class="text-[11px] font-mono">0 words</span>
</div>
</div>
</section>
<!-- END: ReflectionBodySection -->
<!-- BEGIN: ImportanceSection -->
<section class="bg-journal-surface-low border border-journal-border-subtle rounded-3xl p-4 shadow-sm" data-purpose="importance-rating-card">
<div class="flex items-center justify-between mb-1">
<h2 class="text-sm font-bold text-journal-ink tracking-tight flex items-center gap-1.5">
            Importance <span class="text-xs font-normal text-journal-ink-muted">(optional)</span>
</h2>
<span class="text-xs font-medium text-brand-terracotta bg-brand-terracotta-light px-2 py-0.5 rounded-full">High value</span>
</div>
<p class="text-xs text-journal-ink-muted mb-3.5">
          Optional: 1 is low, 5 is high. Tap again to clear.
        </p>
<!-- Selector boxes with 4 actively selected -->
<div aria-label="Importance rating" class="grid grid-cols-5 gap-2.5" role="radiogroup">
<!-- Button 1 -->
<button aria-checked="false" class="h-11 rounded-xl border border-journal-border-subtle bg-journal-surface-lowest font-medium text-sm text-journal-ink hover:border-brand-terracotta/50 transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            1
          </button>
<!-- Button 2 -->
<button aria-checked="false" class="h-11 rounded-xl border border-journal-border-subtle bg-journal-surface-lowest font-medium text-sm text-journal-ink hover:border-brand-terracotta/50 transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            2
          </button>
<!-- Button 3 -->
<button aria-checked="false" class="h-11 rounded-xl border border-journal-border-subtle bg-journal-surface-lowest font-medium text-sm text-journal-ink hover:border-brand-terracotta/50 transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            3
          </button>
<!-- Button 4: Actively Selected in Terracotta -->
<button aria-checked="true" class="h-11 rounded-xl bg-brand-terracotta text-white font-bold text-base shadow-sm ring-2 ring-brand-terracotta/30 flex items-center justify-center transition-all scale-100" role="radio" type="button">
            4
          </button>
<!-- Button 5 -->
<button aria-checked="false" class="h-11 rounded-xl border border-journal-border-subtle bg-journal-surface-lowest font-medium text-sm text-journal-ink hover:border-brand-terracotta/50 transition-all flex items-center justify-center active:scale-95" role="radio" type="button">
            5
          </button>
</div>
</section>
<!-- END: ImportanceSection -->
<!-- BEGIN: ContextTaggingSection -->
<section class="bg-journal-surface-low border border-journal-border-subtle rounded-3xl p-4 shadow-sm" data-purpose="people-places-photos-section">
<h2 class="text-sm font-bold text-brand-terracotta tracking-tight mb-1">
          People, place and photos
        </h2>
<p class="text-xs text-journal-ink-muted mb-3.5">
          Link people or a place, or attach photos.
        </p>
<!-- Dynamic Entity Tags -->
<div class="flex flex-wrap gap-2">
<!-- Person Tag: Farshad -->
<button class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-journal-surface-lowest border border-journal-border-subtle text-xs font-medium text-journal-ink hover:border-brand-terracotta hover:bg-brand-terracotta-light/40 transition-all shadow-xs group" type="button">
<span class="text-brand-terracotta group-hover:scale-110 transition-transform">👤</span>
<span>+ Farshad</span>
</button>
<!-- Person Tag: Maede -->
<button class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-journal-surface-lowest border border-journal-border-subtle text-xs font-medium text-journal-ink hover:border-brand-terracotta hover:bg-brand-terracotta-light/40 transition-all shadow-xs group" type="button">
<span class="text-brand-terracotta group-hover:scale-110 transition-transform">👤</span>
<span>+ Maede</span>
</button>
<!-- Location Tag: Tehran Metro -->
<button class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-journal-surface-lowest border border-journal-border-subtle text-xs font-medium text-brand-sage hover:border-brand-sage hover:bg-brand-sage-light transition-all shadow-xs group" type="button">
<svg class="w-3.5 h-3.5 text-brand-sage fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" fill-rule="evenodd"></path>
</svg>
<span>+ Tehran Metro</span>
</button>
<!-- Photo Trigger -->
<button class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-journal-surface-lowest border border-dashed border-journal-ink-muted/50 text-xs font-medium text-journal-ink-muted hover:border-brand-terracotta hover:text-brand-terracotta hover:bg-brand-terracotta-light/30 transition-all shadow-xs" type="button">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>+ Add snapshot</span>
</button>
</div>
</section>
<!-- END: ContextTaggingSection -->
</main>
<!-- END: FormScrollableContent -->
<!-- BEGIN: BottomActionArea -->
<div class="px-5 pt-3 pb-3 bg-journal-surface shrink-0" data-purpose="save-cta-wrapper">
<button class="w-full py-3.5 px-6 rounded-full bg-brand-terracotta hover:bg-brand-terracotta-hover text-white font-medium text-base tracking-wide shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2" type="button">
<span>Save</span>
</button>
</div>
<!-- END: BottomActionArea -->
<!-- BEGIN: AndroidNavigationBar -->
<div class="w-full py-2.5 px-12 flex justify-around items-center text-journal-ink/70 shrink-0 select-none bg-journal-surface" data-purpose="android-system-navigation">
<!-- Back (Triangle) -->
<button aria-label="Back" class="p-2 active:opacity-40" type="button">
<svg class="w-4 h-4 fill-current rotate-180" viewbox="0 0 24 24">
<polygon points="5 3, 19 12, 5 21"></polygon>
</svg>
</button>
<!-- Home (Circle) -->
<button aria-label="Home" class="p-2 active:opacity-40" type="button">
<div class="w-3.5 h-3.5 rounded-full border-2 border-journal-ink/70"></div>
</button>
<!-- Recent Apps (Square) -->
<button aria-label="Recent Apps" class="p-2 active:opacity-40" type="button">
<div class="w-3 h-3 rounded-[2px] border-2 border-journal-ink/70"></div>
</button>
</div>
<!-- END: AndroidNavigationBar -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
