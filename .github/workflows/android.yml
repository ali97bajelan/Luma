name: Android foundation
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PdomainOnly=true :core:domain:test --no-daemon
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :core:data:testDebugUnitTest :integration:usage:testDebugUnitTest :app:lintDebug :core:data:lintDebug :integration:usage:lintDebug :app:assembleDebugAndroidTest :core:data:assembleDebugAndroidTest --no-daemon
  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          sudo chmod 666 /dev/kvm
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest :core:data:connectedDebugAndroidTest --no-daemon
